[project]
name = "research-bot-api"
version = "0.1.0"
description = "Research Bot API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "anthropic>=0.40",
    "argon2-cffi>=23.1",
    "python-telegram-bot~=21.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# All TCP sockets are blocked (SocketBlockedError); tests needing loopback TCP opt in
# with @pytest.mark.enable_socket. psycopg/libpq connects in C and is unaffected.
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "criterion(id): done-criterion this test proves",
]
